[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vblinlogit"
version = "0.3.0"
description = "Variational Bayesian linear and logistic regression (Python port of VBLinLogit)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = ["numpy", "scipy"]

[project.optional-dependencies]
examples = ["matplotlib"]
test = ["pytest", "matplotlib"]

[tool.setuptools]
packages = ["vblinlogit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: long-running high-dimensional examples"]
